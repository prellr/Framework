name: jester-analytics

x-common: &common
  restart: unless-stopped

services:
  postgres:
    <<: *common
    # pgvector/pgvector:pg17 = Postgres 17 with the vector extension built in.
    # Drop-in for postgres:17 if you never use embeddings.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No LAN port mapping — reachable only over the docker network. Use
    # `docker compose exec postgres psql ...` for any ops access.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    <<: *common
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # No LAN port mapping — reachable only over the docker network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *common
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@postgres:5432/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  api:
    <<: *common
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@postgres:5432/app
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS}
      AGENT_API_KEY: ${AGENT_API_KEY}
      # Master key for encrypting per-user Jester API keys (services/crypto.ts).
      JESTER_MASTER_KEY: ${JESTER_MASTER_KEY}
      # New env vars must be added BOTH here and to the server's .env file.
      # Values are injected at container startup, not baked into the image.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *common
    build:
      context: .
      target: worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@postgres:5432/app
      REDIS_URL: redis://redis:6379
      # The worker decrypts per-user keys in runCell — it needs the master key too.
      JESTER_MASTER_KEY: ${JESTER_MASTER_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  nginx:
    <<: *common
    build:
      context: .
      target: nginx
    # Isolated from the existing homelab-framework nginx (which owns 80/443):
    # serve on a free high host port. LAN-internal tool, no public TLS here.
    ports:
      - "8090:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
