user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Use Docker's internal DNS — re-resolves container IPs every 10s so deploys
    # don't require an nginx reload when the api container restarts.
    # NOTE: resolver + set $var is required for dynamic re-resolution; a named
    # upstream block would cache the IP at startup and ignore this directive.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Force HTTPS for requests that came in over http via Cloudflare (cloudflared sets
        # X-Forwarded-Proto to the client's edge scheme). Direct LAN http access has no such
        # header, so it is left alone.
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }

        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback. index.html must NEVER be cached: hashed asset chunks change on every deploy,
        # and a browser holding a stale index.html references chunks that no longer exist — open tabs
        # go half-dead (chunk 404s → clicks stop responding) on deploy-heavy days. Hashed assets, by
        # contrast, are immutable and can cache forever.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health check
        location /health {
            set $upstream http://api:3000;
            proxy_pass $upstream;
        }

        # API proxy
        location /api/ {
            set $upstream http://api:3000;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # A single backtest polls Jester's async queue for up to ~75s. Keep this comfortably
            # above that so a slow job returns a clean JSON tRPC error, not an nginx 504 HTML page
            # (which the client can't parse — "Unexpected token '<'").
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # SSE — disable buffering for real-time streams
        location /api/sse {
            set $upstream http://api:3000;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Critical for SSE
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
            chunked_transfer_encoding on;
        }

        # MCP server (agent access, JSON-RPC over HTTP) — proxied to the api.
        location /mcp {
            set $upstream http://api:3000;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }

    # HTTPS example — uncomment and provide certs in nginx/ssl/ for LAN TLS
    # (e.g. mkcert). SSL can also terminate upstream (Cloudflare Tunnel etc.),
    # in which case plain :80 above is all you need.
    #
    # server {
    #     listen 443 ssl;
    #     server_name app.local;
    #
    #     ssl_certificate     /etc/nginx/ssl/app.local.pem;
    #     ssl_certificate_key /etc/nginx/ssl/app.local-key.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     root /usr/share/nginx/html;
    #     index index.html;
    #     location / { try_files $uri $uri/ /index.html; }
    #     # ...repeat the /api/ and /api/sse blocks from above...
    # }
}
