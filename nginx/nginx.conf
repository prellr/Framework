user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Use Docker's internal DNS — re-resolves container IPs every 10s so deploys
    # don't require an nginx reload when the api container restarts.
    # NOTE: resolver + set $var is required for dynamic re-resolution; a named
    # upstream block would cache the IP at startup and ignore this directive.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health check
        location /health {
            set $upstream http://api:3000;
            proxy_pass $upstream;
        }

        # API proxy
        location /api/ {
            set $upstream http://api:3000;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # SSE — disable buffering for real-time streams
        location /api/sse {
            set $upstream http://api:3000;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Critical for SSE
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
            chunked_transfer_encoding on;
        }
    }

    # HTTPS example — uncomment and provide certs in nginx/ssl/ for LAN TLS
    # (e.g. mkcert). SSL can also terminate upstream (Cloudflare Tunnel etc.),
    # in which case plain :80 above is all you need.
    #
    # server {
    #     listen 443 ssl;
    #     server_name app.local;
    #
    #     ssl_certificate     /etc/nginx/ssl/app.local.pem;
    #     ssl_certificate_key /etc/nginx/ssl/app.local-key.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     root /usr/share/nginx/html;
    #     index index.html;
    #     location / { try_files $uri $uri/ /index.html; }
    #     # ...repeat the /api/ and /api/sse blocks from above...
    # }
}
